name: Verify Decimal input documentation
on:
  push:
    branches:
      - ci/verify-decimal-input-docs
permissions:
  contents: read
env:
  UV_FROZEN: 'true'
jobs:
  verify:
    name: Documentation ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: baseline
            ref: 9895381aa55eb2a1e74079f0b4fb745d1ea12d12
          - version: patch
            ref: 8d0f893f761042358777c6e63cd54a1bae65f7b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: liorma6/pydantic
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install repository dependencies
        run: uv sync --frozen --all-packages --all-extras --group docs --group testing-extra --group linting
      - name: Reproduce Decimal constructor differences
        run: |
          uv run --no-sync python - <<'PY'
          from decimal import Decimal
          from pydantic import TypeAdapter, ValidationError

          adapter = TypeAdapter(Decimal)
          print(f"Decimal(1.1): {Decimal(1.1)!r}")
          print(f"Validated 1.1: {adapter.validate_python(1.1)!r}")
          assert adapter.validate_python(1.1) == Decimal('1.1')
          assert adapter.validate_python(1.1) != Decimal(1.1)
          for value in (True, False):
              print(f"Decimal({value}): {Decimal(value)!r}")
              try:
                  adapter.validate_python(value)
              except ValidationError as exc:
                  assert exc.errors()[0]['type'] == 'decimal_type'
                  print(f"Pydantic rejects {value} with decimal_type")
              else:
                  raise AssertionError(f"Unexpectedly accepted {value}")
          PY
      - name: Run the standard-library documentation examples
        run: uv run --no-sync pytest tests/test_docs.py -k standard_library_types -q
      - name: Run existing Decimal tests
        run: uv run --no-sync pytest tests/types/test_decimal.py tests/pydantic_core/validators/test_decimal.py -q
      - name: Check the changed Markdown file
        run: uvx pre-commit run --files docs/api/standard_library_types.md --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
      - name: Lint Python sources
        run: uv run --no-sync ruff check pydantic tests docs/plugins release pydantic-core/python pydantic-core/tests pydantic-core/wasm-preview/run_tests.py
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check pydantic tests docs/plugins release pydantic-core/python pydantic-core/tests pydantic-core/wasm-preview/run_tests.py
      - name: Prepare documentation imports
        run: |
          uv run --no-sync python -c 'import docs.plugins.main'
          ln -s pydantic-core/python/pydantic_core pydantic_core
          ln -s .venv/lib/python*/site-packages/pydantic_settings pydantic_settings
          ln -s .venv/lib/python*/site-packages/pydantic_extra_types pydantic_extra_types
      - name: Build all documentation in strict mode
        run: PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync mkdocs build --strict
