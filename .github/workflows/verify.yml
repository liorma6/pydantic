name: Verify polymorphic serialization documentation
on:
  push:
    branches:
      - ci/verify-polymorphic-docs
permissions:
  contents: read
env:
  UV_FROZEN: 'true'
jobs:
  verify:
    name: Documentation ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: baseline
            ref: 6a210d0f191a5561e66df88d21837726bd853e03
          - version: patch
            ref: a81facee3dd900208d3939788cd45736c9279fc8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: liorma6/pydantic
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install repository dependencies
        run: uv sync --frozen --all-packages --all-extras --group docs --group testing-extra --group linting
      - name: Run serialization documentation examples
        run: uv run --no-sync pytest tests/test_docs.py -k serialization -q
      - name: Run existing model serialization tests
        run: uv run --no-sync pytest tests/test_serialize.py tests/test_serialize_as_any.py -q
      - name: Check the changed Markdown file
        run: uvx pre-commit run --files docs/concepts/serialization.md --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
      - name: Lint Python sources
        run: uv run --no-sync ruff check pydantic tests docs/plugins release pydantic-core/python pydantic-core/tests pydantic-core/wasm-preview/run_tests.py
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check pydantic tests docs/plugins release pydantic-core/python pydantic-core/tests pydantic-core/wasm-preview/run_tests.py
      - name: Prepare documentation imports
        run: |
          uv run --no-sync python -c 'import docs.plugins.main'
          ln -s pydantic-core/python/pydantic_core pydantic_core
          ln -s .venv/lib/python*/site-packages/pydantic_settings pydantic_settings
          ln -s .venv/lib/python*/site-packages/pydantic_extra_types pydantic_extra_types
      - name: Build all documentation in strict mode
        run: PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync mkdocs build --strict
